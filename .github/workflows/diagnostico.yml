name: Diagnostico (temporal)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          U=https://www.metro.cl/api/estadoRedDetalle.php
          BR='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36'
          echo "IP runner: $(curl -s https://api.ipify.org)"
          p(){ echo "== $1"; shift; curl -s -o /tmp/b -w "HTTP %{http_code} | %{content_type} | server=%header{server}\n" "$@"; head -c 200 /tmp/b | tr '\n' ' '; echo; }
          p "UA curl por defecto" "$U"
          p "UA script" -A 'metro-santiago-alertas/1.0' "$U"
          p "UA navegador" -A "$BR" "$U"
          p "UA navegador + Referer + Accept-Language" -A "$BR" -e https://www.metro.cl/el-viaje/estado-red -H 'Accept-Language: es-CL,es;q=0.9' "$U"
          p "Pagina estado-red (HTML)" -A "$BR" https://www.metro.cl/el-viaje/estado-red
          p "Home" -A "$BR" https://www.metro.cl/
