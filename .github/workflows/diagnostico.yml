name: Diagnostico (temporal)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          echo "== Texto de la pagina de bloqueo"
          curl -s https://www.metro.cl/api/estadoRedDetalle.php | sed -e 's/<style.*<\/style>//' -e 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 1500; echo
          echo "== Geo de la IP del runner"
          curl -s https://ipinfo.io/json; echo
          echo "== Sustituto api.xor.cl"
          curl -s -o /tmp/x -w "HTTP %{http_code} | %{content_type}\n" https://api.xor.cl/red/metro-network
          head -c 600 /tmp/x; echo
