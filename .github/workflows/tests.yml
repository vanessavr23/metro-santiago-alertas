name: Pruebas

on:
  push:
    paths: ['check_metro.py', 'tests/**', '.github/workflows/tests.yml']
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'   # versión mínima soportada
      - run: python -m unittest discover -s tests -v
